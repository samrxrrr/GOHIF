name: GOHIF GAE CI

on:

  push:

    branches:
      - master
      - main

  pull_request:

    branches:
      - master
      - main

jobs:

  test:

    runs-on: ubuntu-latest

    strategy:

      matrix:

        python-version:
          - "3.11"
          - "3.12"

    steps:

      - name: Checkout

        uses: actions/checkout@v4

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: ${{ matrix.python-version }}

      - name: Install

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt

          pip install -e .

      - name: Run Tests

        env:

          PYTHONPATH: src

        run: |

          pytest -v \
          --cov=src/gae \
          --cov-report=xml \
          --cov-report=term

      - name: Upload Coverage

        uses: actions/upload-artifact@v4

        with:

          name: coverage-${{ matrix.python-version }}

          path: coverage.xml
