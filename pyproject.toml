[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gohif"
version = "0.1.0"
description = "Global One Health Intelligence Framework"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}

authors = [
    {name = "Mohd Sameer"},
]

keywords = [
    "bioinformatics",
    "one-health",
    "amr",
    "genomics",
    "machine-learning",
    "knowledge-graph",
    "computational-biology",
    "evidence-integration"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics"
]

dependencies = [
    "pandas>=2.3",
    "numpy>=2.2",
    "pyarrow>=20.0",
    "duckdb>=1.3",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "PyYAML>=6.0",
    "rich>=14.0",
    "typer>=0.16",
    "loguru>=0.7",
    "networkx>=3.5",
    "platformdirs>=4.3"
]

[project.optional-dependencies]

dev = [
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "mypy>=1.17",
    "ruff>=0.12",
    "pre-commit>=4.2",
    "build>=1.3",
    "twine>=6.1"
]

[project.scripts]

gohif = "gohif.cli.main:app"

[tool.setuptools]

package-dir = {"" = "src"}

[tool.setuptools.packages.find]

where = ["src"]

[tool.ruff]

line-length = 88
target-version = "py312"

[tool.ruff.lint]

select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.pytest.ini_options]

testpaths = [
    "tests"
]

pythonpath = [
    "src"
]

addopts = "-ra"

[tool.mypy]

python_version = "3.12"

strict = true

warn_unused_configs = true

warn_return_any = true

warn_unused_ignores = true

disallow_untyped_defs = true

ignore_missing_imports = true
